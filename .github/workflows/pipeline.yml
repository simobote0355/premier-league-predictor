name: pipeline

on:
  schedule:
    - cron: "0 7 * * *"   # 07:00 UTC = 02:00 Bogota, before any Premier League kickoff
  workflow_dispatch:       # manual run button in the Actions tab

permissions:
  contents: write          # lets the job push commits

concurrency:
  group: pipeline          # never two runs at the same time
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          python src/ingest_api.py
          python src/clean.py
          python src/features.py
          python src/model.py
          python src/track_predictions.py log
          python src/track_predictions.py score

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Daily pipeline run"
          git pull --rebase
          git push
